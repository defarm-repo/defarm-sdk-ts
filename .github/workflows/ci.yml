name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      # Examples compile forever or CI fails — freshness applied to the examples themselves.
      - run: npx tsc -p tsconfig.examples.json --noEmit
      # The suite includes the cross-language conformance vectors generated by the Rust oracle
      # (engines#591). It FAILS CLOSED if the vectors are missing or empty — a green run always
      # means conformance actually executed.
      - run: npx vitest run
