name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      # The suite includes the cross-language conformance vectors generated by the Rust oracle
      # (engines#591). It FAILS CLOSED if the vectors are missing or empty — a green run always
      # means conformance actually executed.
      - run: npx vitest run
