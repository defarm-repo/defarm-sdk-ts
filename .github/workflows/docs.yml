# Issue engines#588: reference docs GENERATED FROM THE CODE on every merge to main — no drift
# by construction. Published via GitHub Pages (the API reference IS the code's TSDoc; the
# quickstart is the README, rendered as the landing page).
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # treatWarningsAsErrors in typedoc.json: a broken doc link or an unexported referenced
      # type fails the build instead of publishing a hole.
      - run: npx typedoc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
