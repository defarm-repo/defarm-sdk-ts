# Issue engines#588: reference docs GENERATED FROM THE CODE on every merge to main — no drift
# by construction. Published via GitHub Pages (the API reference IS the code's TSDoc; the
# quickstart is the README, rendered as the landing page).
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Docs never publish over a broken suite — tests gate the upload.
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx vitest run
      # treatWarningsAsErrors in typedoc.json: a broken doc link or an unexported referenced
      # type fails the build instead of publishing a hole.
      - run: npx typedoc
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
